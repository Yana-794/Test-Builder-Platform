services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
  redis: 
    image: redis:7-alpine
    container_name: redis
    command:  redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_ADDR: ${HTTP_ADDR}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      GIN_MODE: release
      REDIS_ADDR: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - back
    networks:
      - frontend_network
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: test-builder-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - back
    networks:
      - backend_network
volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge